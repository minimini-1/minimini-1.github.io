<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Visitor locations</title>
    <script>
      try { document.documentElement.dataset.theme = parent.document.documentElement.dataset.theme || 'light'; } catch {}
    </script>
    <style>
      html, body { margin: 0; background: #f7f7f2; overflow: hidden; color-scheme: light; }
      html[data-theme="dark"], html[data-theme="dark"] body { background: #151c19; }
      html[data-theme="dark"] .visitor-map-embed { filter: invert(1) hue-rotate(180deg) brightness(1.5) saturate(.65); mix-blend-mode: lighten; }
      .visitor-globe {
        width: 230px;
        height: 170px;
        padding-top: 36px;
        box-sizing: border-box;
      }
      .visitor-map-embed {
        width: 304px;
        transform: scale(0.7565789474);
        transform-origin: top left;
      }
    </style>
  </head>
  <body>
    <div class="visitor-globe">
      <div class="visitor-map-embed">
        <script type="text/javascript" id="mapmyvisitors" src="https://mapmyvisitors.com/map.js?cl=c8ccca&amp;w=a&amp;t=n&amp;d=yR-YRrxhCRNyvlJEqG5SZnOQRGyvjHdv7512OHUL02M&amp;co=f7f7f2&amp;cmo=4f6d7d&amp;cmn=718879"></script>
      </div>
    </div>
  </body>
</html>
